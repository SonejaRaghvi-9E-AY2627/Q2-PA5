<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>
    <link rel="stylesheet" href="style.css">
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
</head>
<body>
    <div class="container bg-warning p-5 mt-5 rounded">
        <form action="" method="post">
            <h2>Custom Sneaker Order Form</h2>

            <label for="form-name">Name:</label> 
            <input type="text" name="username" id="form-name" class="textinput form-control">
            
            <label for="form-email">Email:</label> 
            <input type="email" name="emailaddress" id="form-email"class="textinput form-control">

            <label for="form-tel">Telephone:</label> 
            <input type="tel" name="telephone" id="form-tel"class="textinput form-control">

            <label for="form-story">Tell us about yourself:</label> 
            <textarea name="story" maxlength="600" id="form-story" class="textinput form-control" placeholder="No more than 600 characters long"></textarea>
        
            <label for="sizes">Size:</label>
            <select name="size" id="sizes" class="form-select">
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
            </select> 
            <em>Sizes reflect standard US men's sizes</em>
            
            <label for="colors">Sneaker Color:</label>
            <fieldset id="colors">
                <legend>Color</legend>
            
            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" name="color" value="red"> Red
                </label>
            </div>
            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" name="color" value="blue"> Blue
                </label>
            </div>
            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" name="color" value="black"> Black
                </label>
            </div>
            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" name="color" value="Silver"> Silver
                </label>
            </div>
            </fieldset>
            <label for="features">Add-on Features:</label>
            <fieldset id="features">
                <legend>Feature</legend>
                <div class="form-check">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="feature" value="laces"> Sparkley laces
                    </label>
                </div>
                <div class="form-check">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="feature" value="logo"> Metallic Logo
                    </label>
                </div>
                <div class="form-check">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="feature" value="heels"> Light-up Heels
                    </label>
                </div>
                <div class="form-check">
                    <label class="form-check-label">
                        <input class="form-check-input" type="checkbox" name="feature" value="mp3"> MP-3 Enabled
                    </label>
                </div>
            </fieldset>
            
            <button type="button" class="btn btn-primary" value="ENTER">ENTER
        </form>
    </div>
</body>
</html>
